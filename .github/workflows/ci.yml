name: CI Pipeline with PostgreSQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend-with-db:
    runs-on: ubuntu-latest
    
    # PostgreSQL service container
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops123
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Initialize database schema
        working-directory: ./backend
        env:
          PGPASSWORD: devops123
        run: |
          psql -h localhost -U devops -d ecommerce -f database/init.sql
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Run database tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: devops
          DB_PASSWORD: devops123
          DB_NAME: ecommerce
        run: npm test
      
      - name: Run linter
        working-directory: ./backend
        run: npm run lint

  build-docker-images:
    runs-on: ubuntu-latest
    needs: test-backend-with-db
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build backend image
        run: docker build -t ecommerce-backend:latest ./backend
      
      - name: Build frontend image
        run: docker build -t ecommerce-frontend:latest ./frontend
      
      - name: Verify builds
        run: |
          docker images | grep ecommerce
          echo "✅ All images built successfully!"